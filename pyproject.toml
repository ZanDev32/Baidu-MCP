[project]
name = "baidu-mcp-server"
version = "0.2.0"
description = "MCP server for Baidu web search and page extraction (stdio + streamable HTTP, CDP-capable)"
readme = "README.md"
authors = [{ name = "Evilran" }, { name = "ZanDev32" }]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "curl-cffi>=0.7.3",
    "httpx>=0.28.1",
    "markdownify>=1.1.0",
    "mcp>=2,<3",
    "readabilipy>=0.3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]

[project.urls]
Homepage = "https://github.com/ZanDev32/Baidu-MCP"
Repository = "https://github.com/ZanDev32/Baidu-MCP"
Issues = "https://github.com/ZanDev32/Baidu-MCP/issues"
Upstream = "https://github.com/Evilran/baidu-mcp-server"

[project.scripts]
baidu-mcp-server = "baidu_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
